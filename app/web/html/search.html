<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FixCart</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
    <header>
        <a href="home.html"><h1>FixCart</h1></a>
        <form>
            <input type="text" id="search_bar" placeholder="Search">
            <input type="button" id="search_button" value="Submit">
        </form>
    </header>
    <main>
        <aside>
            <h3>Filters</h3>
            <ul>
                <li><button>Categories</button></li>
                <li><button>Location</button></li>
                <li><button>Price Range</button></li>
                <li><button>Rating</button></li>
            </ul>
        </aside>
        <nav class="Picked_Filtes">
            <ul>
                <li><button>Electronics</button></li>
                <li><button>New York</button></li>
                <li><button>$50-$100</button></li>
                <li><button>4 Stars+</button></li>
            </ul>
        </nav>
        <section id="Search_Results">
            <ul>
               <li>
                    <h2>Product Name</h2>
                    <p>Product Description</p>
                    <p>Price: $XX.XX</p>
                    <p>Rating: X.X/5</p>
               </li>
               <li>
                    <h2>Product Name</h2>
                    <p>Product Description</p>
                    <p>Price: $XX.XX</p>
                    <p>Rating: X.X/5</p>
               </li>  
            </ul>
        </section>
    </main>
    <footer>
        <p><a href="about.html">© 2026 @Lampros Katsaros</a></p>
    </footer>
</body>
</html>
